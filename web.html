<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Projects</title>
  <style>
    /* 전체 배경: 격자무늬 */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
      background-color: #f9f9f9;
      background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      background-size: 20px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 0;
    }

    .project-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 40px;
      max-width: 800px;
      width: 90%;
      text-align: center;
    }

    .project-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #222;
    }

    .project-desc {
      font-size: 1rem;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .main-images {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .main-image {
      flex: 1;
      max-width: 350px;
      min-width: 300px;
    }

    .main-image img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .main-image img:hover {
      transform: scale(1.02);
    }

    .video-section {
      margin-bottom: 30px;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .video-container video {
      width: 100%;
      height: auto;
      display: block;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .project-btn {
      display: inline-block;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background-color: #111;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .project-btn:hover {
      background-color: #333;
    }

    .download-btn {
      background-color: #0099cc;
    }

    .download-btn:hover {
      background-color: #0077aa;
    }

    @media (max-width: 768px) {
      .main-images {
        flex-direction: column;
        align-items: center;
      }
      
      .main-image {
        max-width: 100%;
        width: 100%;
      }
    }

    /* 모달 스타일 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      overflow: auto;
    }

    .modal-content {
      position: relative;
      margin: 50px auto;
      max-width: 90%;
      width: fit-content;
    }

    .modal-content img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }

    .close {
      position: fixed;
      top: 15px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
    }

    .close:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="project-card">
    <div class="project-title">📂 Web Projects Documentation</div>
    <div class="project-desc">
      이 프로젝트는 팀 프로젝트 ECOVERY의 일부분입니다.<br/>
      이 프로젝트에서 저는 UI/UX를 담당하였습니다.<br/>
      주요 기능으로는 제품 검색, 필터링, 장바구니, 결제 시스템이 포함되어 있습니다.<br/>
    </div>
    
    <!-- 메인 홈페이지 사진  -->
    <div class="main-images">
      <div class="main-image">
        <img src="img/에코버리 메인.JPG" alt="홈페이지 메인 이미지 1" onclick="openModal(this)" />
      </div>
      
    </div>
    
    <!-- 사이트 영상 -->
    <div class="video-section">
      <div class="video-container">
        <video controls>
          <source src="video/KakaoTalk_20250813_015607784.mp4" type="video/mp4">
        
        </video>
      </div>
    </div>
    
    
    </div>
  </div>

  <!-- 이미지 모달 -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close" onclick="closeModal()">&times;</span>
    <div class="modal-content">
      <img id="modalImage" src="" alt="">
    </div>
  </div>

  <script>
    function openModal(img) {
      document.getElementById('imageModal').style.display = 'block';
      document.getElementById('modalImage').src = img.src;
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    // ESC 키로도 모달 닫기
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeModal();
      }
    });
  </script>
</body>
</html>
