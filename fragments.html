<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fragments with Tabs</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Pretendard', sans-serif;
      background: #f9f9f9;
      color: #333;
    }

    .fragments {
      padding: 60px 30px;
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: #777;
      margin-bottom: 30px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 40px;
    }

    .tab-btn {
      padding: 10px 20px;
      background: #eee;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.3s;
    }

    .tab-btn.active {
      background: #222;
      color: #fff;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-content.active {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease;
    }

    .card img {
      width: 100%;
      display: block;
      transition: opacity 0.3s ease;
    }

    .card:hover img {
      opacity: 0.3;
    }

    .card::after {
      content: "클릭해서 보기";
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover::after {
      opacity: 1;
    }

    /* 모달 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 40px;
      width: 90%;
      max-width: 480px;
      border-radius: 16px;
      text-align: center;
      position: relative;
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 24px;
      font-size: 24px;
      cursor: pointer;
      color: #aaa;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>
  <section class="fragments">
    <h1>Fragments</h1>
    <p class="subtitle">완성되지 못했거나, 마음에 들지 않았던 그 조각들</p>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="unfinished">미완성</button>
      <button class="tab-btn" data-tab="rejected">별로인</button>
      <button class="tab-btn" data-tab="etc">기타</button>
    </div>

    <!-- Tab Content: 미완성 -->
    <div class="tab-content active" id="unfinished">
      <div class="card" onclick="openModal('modal1')">
        <img src="images/fragment1.jpg" alt="미완성1" />
      </div>
    </div>

    <!-- Tab Content: 별로인 -->
    <div class="tab-content" id="rejected">
      <div class="card" onclick="openModal('modal2')">
        <img src="images/fragment2.jpg" alt="별로인1" />
      </div>
    </div>

    <!-- Tab Content: 기타 -->
    <div class="tab-content" id="etc">
      <div class="card" onclick="openModal('modal3')">
        <img src="images/fragment3.jpg" alt="기타1" />
      </div>
    </div>
  </section>

  <!-- Modal 1 -->
  <div class="modal" id="modal1">
    <div class="modal-content">
      <span class="close" onclick="closeModal('modal1')">&times;</span>
      <h2>미완성 드로잉</h2>
      <p>작업 중단된 이유와 현재 고민 중인 방향성을 설명할 수 있어요.</p>
    </div>
  </div>

  <!-- Modal 2 -->
  <div class="modal" id="modal2">
    <div class="modal-content">
      <span class="close" onclick="closeModal('modal2')">&times;</span>
      <h2>별로인 디자인</h2>
      <p>의도는 좋았지만 최종적으로 제외된 디자인입니다.</p>
    </div>
  </div>

  <!-- Modal 3 -->
  <div class="modal" id="modal3">
    <div class="modal-content">
      <span class="close" onclick="closeModal('modal3')">&times;</span>
      <h2>기타 테스트</h2>
      <p>실험적 시도나 자유 연습 결과물들을 모았습니다.</p>
    </div>
  </div>

  <script>
    // 탭 기능
    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        tabContents.forEach(c => c.classList.remove('active'));
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // 모달 기능
    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // ESC 키로 모달 닫기
    document.addEventListener('keydown', function(e) {
      if (e.key === "Escape") {
        document.querySelectorAll('.modal').forEach(modal => modal.style.display = 'none');
      }
    });
  </script>
</body>
</html>
